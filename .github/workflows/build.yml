name: Build (macOS)

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ForgeGradle 2.3 + Gradle 4.10.3 require JDK 8 strictly.
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-macos-4.10.3-${{ hashFiles('build.gradle', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-macos-4.10.3-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # ForgeGradle 2.3 needs the decompiled/recompiled MC workspace present
      # before compiling mod sources. `setupCiWorkspace` is the lightweight CI
      # variant (no full decompile, uses cached deobf sources).
      - name: Set up Forge dev workspace
        run: ./gradlew setupCiWorkspace --no-daemon --stacktrace

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload final mod jar
        uses: actions/upload-artifact@v4
        with:
          name: MetalUniversal-1.12.2-macOS
          path: |
            build/libs/*-all.jar
            build/libs/MetalUniversal-1.12.2-*.jar
          if-no-files-found: error

      - name: Summarize artifacts
        run: |
          echo "## Build artifacts (macOS)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          for f in build/libs/*.jar; do
            size=$(du -h "$f" | cut -f1)
            echo "| \`$(basename "$f")\` | $size |" >> $GITHUB_STEP_SUMMARY
          done
