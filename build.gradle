plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

loom {
	accessWidenerPath = file("src/main/resources/metallum.accesswidener")
}

repositories {
	maven { url "https://api.modrinth.com/maven" }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "maven.modrinth:sodium:${project.sodium_version}"

	// Iris 26.2 (optional). When Iris is present AND the Metal backend is
	// active, the metallum iris intercept mixins (com.metallum.mixin.iris.*)
	// take over shaderpack compilation; when Metal is not active those mixins
	// are no-ops and Iris uses its normal GL path. implementation (matching
	// sodium above) puts Iris on the compile classpath so the @Mixin targets
	// (GlShader, ShaderCreator) resolve at compile time and Iris loads in dev
	// runs. Note: Loom 1.16-SNAPSHOT (MC 26.2) no longer provides the
	// modImplementation configuration; plain Gradle configurations are used.
	implementation "maven.modrinth:iris:${project.iris_version}"

	// Test: BSL end-to-end GLSL→SPIR-V→MSL compile fixture. JUnit 5 + zip
	// extraction only; the test is gated (see BslShaderCompileTest) so it
	// no-ops on hosts where the native glslang dylib cannot load.
	testImplementation platform('org.junit:junit-bom:5.11.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Iris ships its preprocessing stack as Fabric nested jars. A plain JUnit
// worker does not expand those jars, so expose the exact embedded binaries to
// headless ShaderPack/TransformPatcher tests without adding parallel versions.
tasks.register("extractIrisNestedJars", Copy) {
	from({
		def irisJar = configurations.compileClasspath.files.find {
			it.name.startsWith("iris-") && it.name.endsWith(".jar")
		}
		irisJar != null ? zipTree(irisJar) : []
	}) {
		include "META-INF/jars/*.jar"
	}
	eachFile { it.path = it.name }
	includeEmptyDirs = false
	into layout.buildDirectory.dir("iris-nested-jars")
}

def irisNestedJars = fileTree("${buildDir}/iris-nested-jars") { include "*.jar" }
irisNestedJars.builtBy("extractIrisNestedJars")
dependencies {
	testRuntimeOnly irisNestedJars
}

test {
	useJUnitPlatform()
	testLogging {
		exceptionFormat = "full"
	}
	exclude "**/MetalMrtBackendIntegrationTest.class"
	exclude "**/MetalComputeBackendIntegrationTest.class"
	exclude "**/MetalGenericVertexAttributeIntegrationTest.class"
	exclude "**/IrisMetalPingPongTargetsIntegrationTest.class"
	exclude "**/MetalIrisCustomTexturesIntegrationTest.class"
	exclude "**/MetalIrisNoiseTextureIntegrationTest.class"
	exclude "**/IrisMetalCenterDepthSamplerTest.class"
	exclude "**/MellowCustomTexturesIntegrationTest.class"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.register("buildMacNative", Exec) {
	onlyIf {
		org.gradle.internal.os.OperatingSystem.current().isMacOsX()
	}

	workingDir project.projectDir
	doFirst {
		file("src/main/resources/natives/macos").mkdirs()
	}

	commandLine "swiftc",
		"-O",
		"-whole-module-optimization",
		"-emit-library",
		"-module-name", "metallum_native",
		"-target", "arm64-apple-macosx14.0",
		"-framework", "Foundation",
		"-framework", "Metal",
		"-framework", "QuartzCore",
		"-o", "src/main/resources/natives/macos/libmetallum.dylib",
		"src/main/native/MetallumNative.swift"
}

