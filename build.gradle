/*
 * MetalUniversal 1.12.2 Forge port
 *
 * This build is based on ForgeGradle 2.3 (the 1.12.2-era Gradle plugin).
 * It targets Java 8 and uses MCP stable_39 mappings. The native Metal dylib
 * is shipped inside the jar under /natives/macos and extracted at runtime, so
 * no separate native download is wired into the build.
 *
 * Mixin is bootstrapped via an IFMLLoadingPlugin coremod (see
 * src/main/resources/coremods/metallum_coremod.json) because Forge 1.12.2 does
 * not ship the Mixin runtime. The SpongePowered Mixin + ASM jars are declared
 * as bundled dependencies so they are present on the classpath at launch.
 */

buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        maven { url = 'https://plugins.gradle.org/m2/' }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT'
        classpath 'org.spongepowered:mixingradle:0.6-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'
apply plugin: 'org.spongepowered.mixin'
apply plugin: 'maven-publish'

version = project.mod_version
group = project.group
archivesBaseName = 'MetalUniversal-1.12.2'

sourceCompatibility = targetCompatibility = '1.8'
compileJava.options.encoding = 'UTF-8'

minecraft {
    version = "${project.minecraft_version}-${project.forge_version}"
    runDir = 'run'
    mappings = project.mcp_mappings

    // Make dev-time crashes readable.
    makeObfSourceJar = false

    replace '${mod_version}', project.version
    replaceIn 'Metallum.java'
}

mixin {
    add sourceSets.main, 'metallum.refmap.json'
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

configurations {
    embed
    compile.extendsFrom(embed)
}

dependencies {
    // Mixin runtime + ASM, bundled into the mod jar so Forge can load them
    // via the coremod classloader without external installs.
    embed('org.spongepowered:mixin:0.8.5-SNAPSHOT') {
        exclude module: 'guava'
        exclude module: 'commons-io'
        exclude module: 'gson'
        exclude module: 'asm-commons'
        exclude module: 'asm-tree'
        exclude module: 'asm'
        exclude module: 'launchwrapper'
    }
    embed 'org.ow2.asm:asm:9.2'
    embed 'org.ow2.asm:asm-tree:9.2'
    embed 'org.ow2.asm:asm-commons:9.2'
    embed 'org.ow2.asm:asm-util:9.2'

    // LWJGL 2 (1.12.2 ships LWJGL 2 via Minecraft itself) is provided on the
    // classpath at runtime by the game. We only need it at compile time.
    compileOnly 'org.lwjgl.lwjgl:lwjgl:2.9.4-nightly-20150209'
}

// The plain `jar` task contains only our own classes, so ForgeGradle's
// `reobfJar` (which re-maps MCP names back to SRG production names) can run on
// it cleanly — embedding Mixin/ASM into the same jar beforehand breaks the
// reobf ClassReader (ForgeGradle 2.3 ships an older ASM that chokes on ASM 9.2
// classes). Instead we merge the embed scope into the *reobfed* jar afterwards
// via `mergeEmbbedded` (see below), which is the final artifact to ship.
jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes([
            'FMLCorePlugin': 'com.metallum.coremod.MetallumCoremod',
            'FMLCorePluginContainsFMLMod': 'true',
            'ForceLoadAsMod': 'true',
            'MixinConfigs': 'metallum.mixins.json',
            'Specification-Title': 'MetalUniversal',
            'Specification-Version': project.version,
            'Implementation-Title': project.name,
            'Implementation-Version': project.version
        ])
    }
}

// Final distributable: reobfed mod classes + bundled Mixin/ASM runtime.
// Forge 1.12.2 does not ship the Mixin runtime, so the mod carries it via the
// coremod classloader. ASM 9.2 signatures/module-info (if any) are stripped.
task mergeEmbedded(type: Jar, dependsOn: 'reobfJar') {
    // Distinct classifier so this never collides with reobfJar's output path
    // (which is the default jar path). The '-all' jar is the final shippable.
    classifier = 'all'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    // `reobfJar.getJar()` resolves lazily at execution time (after reobf runs).
    from { zipTree(reobfJar.getJar()) }
    from({
        configurations.embed.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    })
    exclude 'META-INF/*.RSA', 'META-INF/*.SF', 'META-INF/*.DSA'
    exclude 'module-info.class', 'META-INF/versions/**', 'META-INF/maven/**'

    manifest {
        attributes([
            'FMLCorePlugin': 'com.metallum.coremod.MetallumCoremod',
            'FMLCorePluginContainsFMLMod': 'true',
            'ForceLoadAsMod': 'true',
            'MixinConfigs': 'metallum.mixins.json',
            'Specification-Title': 'MetalUniversal',
            'Specification-Version': project.version,
            'Implementation-Title': project.name,
            'Implementation-Version': project.version
        ])
    }
}

// Make `build` (and `jar`) produce the merged, shippable artifact.
build.dependsOn 'mergeEmbedded'

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', project.minecraft_version

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info', 'metallum.mixins.json'
        expand 'version': project.version, 'mcversion': project.minecraft_version
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info', 'metallum.mixins.json'
    }
}
