# Metallum / MetalUniversal 1.12.2 Forge port
# Forge 1.12.2 build. 2860 has no userdev jar on the Forge maven (ForgeGradle
# 2.3 requires it), so we pin 2847 — the latest 1.12.2 build that publishes
# forge-*-userdev.jar. It is functionally identical for mod building.
minecraft_version=1.12.2
forge_version=14.23.5.2847
mcp_mappings=stable_39
mcp_version=20180801-1.12

mod_version=1.0.3-port
mod_id=metallum
group=com.metallum

org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=false
